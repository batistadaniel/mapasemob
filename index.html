<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Mapa Semob</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#ffffff">

    <style>
        /* === VARIÁVEIS === */
        :root {
            --primary: #2563eb;
            --bg-app: #f8fafc;
            --surface: rgba(255, 255, 255, 0.95);
            --surface-solid: #ffffff;
            --text-main: #1e293b;
            --text-sec: #64748b;
            --border: rgba(0, 0, 0, 0.12);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            --bottom-sheet-height: 35vh;

            --cor-piracicabana: #449900;
            --cor-pioneira: #ffd500;
            --cor-urbi: #0080ff;
            --cor-marechal: #ff9100;
            --cor-bsbus: #4dff00;
            --cor-outros: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg-app); }
        
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        .map-container { height: 100%; width: 100%; position: absolute; top: 0; left: 0; }
        #map { height: 100%; width: 100%; z-index: 0; background: var(--bg-app); }

        .leaflet-control-attribution { display: none !important; }

        .glass-panel {
            background: var(--surface);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: var(--border); box-shadow: var(--shadow); border-radius: 12px; color: var(--text-main);
        }

        /* === TOP BAR (PESQUISA) === */
        .top-bar {
            position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 420px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .top-bar > * { pointer-events: auto; }

        .search-container { width: 100%; height: 48px; display: flex; align-items: center; padding: 0 15px; border-radius: 24px; position: relative; }
        #search { flex: 1; border: none; background: transparent; font-size: 16px; outline: none; height: 100%; color: var(--text-main); font-weight: 500; margin-left: 10px; padding-right: 30px; }
        
        .search-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; background: rgba(128,128,128,0.2); border-radius: 50%; display: none; justify-content: center; align-items: center; cursor: pointer; color: var(--text-sec); font-size: 12px; font-weight: 800; }
        .search-clear.visible { display: flex; }

        .search-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .tag { background: var(--text-main); color: var(--surface-solid); font-size: 11px; padding: 4px 10px; border-radius: 20px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        
        .suggestions { background: var(--surface-solid); margin-top: 5px; border-radius: 12px; max-height: 45vh; overflow-y: auto; display: none; box-shadow: var(--shadow); color: var(--text-main); width: 100%; }
        .suggestion-item { padding: 12px 15px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 14px; transition: background 0.1s; }
        .suggestion-item.highlighted { background: rgba(37, 99, 235, 0.15); color: var(--primary); font-weight: 700; }

        /* === BUTTONS === */
        .fab-container { position: absolute; bottom: max(30px, env(safe-area-inset-bottom)); right: 15px; display: flex; flex-direction: column-reverse; gap: 10px; z-index: 900; transition: bottom 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); }
        body.sheet-open .fab-container { bottom: calc(var(--bottom-sheet-height) + 20px); }

        .fab-btn { width: 44px; height: 44px; border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.1s, background 0.2s; color: var(--text-main); border: 1px solid rgba(128,128,128,0.2); background: var(--surface-solid); }
        #btn-recenter { background: var(--surface-solid); color: var(--primary); border: 2px solid var(--primary); display: none; }
        #btn-recenter.show { display: flex; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* === BOTTOM SHEET (Mobile) === */
        .bottom-sheet { position: fixed; left: 0; bottom: 0; width: 100%; height: var(--bottom-sheet-height); background: var(--surface-solid); border-top-left-radius: 24px; border-top-right-radius: 24px; box-shadow: 0 -5px 30px rgba(0,0,0,0.15); z-index: 1100; transform: translateY(110%); transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); display: flex; flex-direction: column; padding: 0; touch-action: none; }
        .bottom-sheet.active { transform: translateY(0); }
        .sheet-handle-bar { width: 100%; height: 30px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; cursor: grab; }
        .sheet-handle { width: 80px; height: 5px; background: rgba(128,128,128,0.3); border-radius: 5px; }
        .sheet-content { flex: 1; padding: 0 20px 20px 20px; overflow-y: auto; }
        .sheet-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sheet-title { font-size: 20px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; flex: 1; }
        .sheet-close { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; background: rgba(128,128,128,0.1); border-radius: 50%; cursor: pointer; font-weight: 600; }

        @media (min-width: 768px) {
            .bottom-sheet { display: none !important; }
            body.sheet-open .fab-container { bottom: max(30px, env(safe-area-inset-bottom)) !important; }
        }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .info-card { background: rgba(128,128,128,0.05); padding: 8px 10px; border-radius: 10px; }
        .info-label { font-size: 10px; text-transform: uppercase; color: var(--text-sec); font-weight: 600; margin-bottom: 2px; }
        .info-value { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; }

        /* === WIFI ICON === */
        .wifi-icon { width: 20px; height: 20px; color: #00d655; display: block; }
        .wifi-layer { opacity: 0; animation: wifi-appear 1.5s ease-in-out infinite; }
        @keyframes wifi-appear { 0% { opacity: 0; } 15% { opacity: 1; } 65% { opacity: 1; } 100% { opacity: 0; } }
        .layer-1-dot { animation-delay: 0.0s; }
        .layer-2-arc { animation-delay: 0.15s; }
        .layer-3-arc { animation-delay: 0.3s; }
        .layer-4-arc { animation-delay: 0.45s; }

        /* === ESTILOS DOS BADGES DOS MARCADORES COM PINO (BALÃO) === */
        .bus-marker-container {
            background: transparent;
            border: none;
        }

        .bus-marker-inner { 
            position: absolute; 
            transform: translate(-50%, -100%); 
            pointer-events: auto; 
            cursor: pointer; 
        }
        
        .bus-badge {
            position: relative;
            background: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            font-weight: 800;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 8px;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Ponta do Balão / Pino apontando para baixo */
        .bus-badge::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 7px solid #000000;
        }

        .bus-prefixo-highlight {
            padding: 1px 4px;
            border-radius: 4px;
            color: #000000;
            font-weight: 800;
        }

        /* Customização dos clusters de contagem */
        .marker-cluster {
            background-clip: padding-box;
            border-radius: 50%;
        }
        .marker-cluster div {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
        }

        /* === ESTILOS DO POPUP DESKTOP === */
        .leaflet-popup-content-wrapper {
            background: var(--surface-solid); color: var(--text-main); border-radius: 14px; padding: 0; 
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3); font-family: 'Inter', sans-serif; border: none;
        }
        .leaflet-popup-content { margin: 0 !important; width: 220px !important; line-height: 1.3; }
        .leaflet-container a.leaflet-popup-close-button { top: 6px; right: 6px; color: #fff; text-shadow: 0 0 2px rgba(0,0,0,0.5); font-size: 16px; }
        .leaflet-popup-tip { background: var(--surface-solid); }
        
        .popup-header { 
            padding: 8px; 
            font-weight: 800; text-align: center; border-radius: 14px 14px 0 0; 
            font-size: 14px; color: #000; background: rgba(128,128,128,0.1); border-top: 4px solid transparent; 
        }
        .popup-body { padding: 8px 12px; font-size: 12px; }
        .popup-row { display: flex; justify-content: space-between; margin-bottom: 3px; align-items: flex-start; }
        .popup-label { color: var(--text-sec); font-weight: 500; }
        .popup-val { font-weight: 700; color: var(--text-main); text-align: right; }

        .user-location-marker { width: 16px; height: 16px; background: #2563eb; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.3); }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>

<body>

    <div class="map-container"><div id="map"></div></div>

    <div class="top-bar">
        <div class="glass-panel search-container">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--text-sec)"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search" placeholder="Linha ou prefixo..." autocomplete="off" inputmode="numeric">
            <div class="search-clear" id="btn-search-clear" onclick="limparBuscaInput()">✕</div>
        </div>
        <div id="search-tags" class="search-tags"></div>
        <div id="suggestions" class="suggestions"></div>
    </div>

    <div class="fab-container">
        <div class="fab-btn glass-panel" id="btn-location" onclick="toggleLocation()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"></circle></svg></div>
        <div class="fab-btn glass-panel" id="btn-recenter" onclick="fitBusRoute()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        </div>
    </div>

    <div id="bottom-sheet" class="bottom-sheet">
        <div class="sheet-handle-bar"><div class="sheet-handle"></div></div>
        <div class="sheet-content" id="sheet-data"></div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        const BASE_API_URL = "https://backend-semob.vercel.app/api_semob_df/ultima-localizacao";
        const CORES = { 
            "Piracicabana": "#449900", 
            "Pioneira": "#ffd500", 
            "Urbi": "#0080ff", 
            "Marechal": "#ff9100", 
            "BsBus": "#4dff00", 
            "Outros": "#888888" 
        };

        const map = L.map('map', { zoomControl: false, tap: true }).setView([-15.7942, -47.8822], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { detectRetina: true }).addTo(map);

        // CONFIGURAÇÃO: Ao clicar no cluster, abre em espiral sem dar zoom no mapa
        const busClusterGroup = L.markerClusterGroup({
            maxClusterRadius: 40,
            zoomToBoundsOnClick: false,
            spiderfyOnMaxZoom: true,
            spiderfyDistanceMultiplier: 1.5,
            showCoverageOnHover: false,
            spiderLegPolylineOptions: { 
                weight: 2, 
                color: '#000000', 
                opacity: 0.7,
                dashArray: '4, 4'
            }
        }).addTo(map);

        // Evento de clique para abrir o cluster em espiral diretamente
        busClusterGroup.on('clusterclick', function (a) {
            a.layer.spiderfy();
        });

        let markersRegistry = {}, todosDados = [], amostragemIds = new Set(), modoAmostragem = true, termosBusca = [], dadosTracado = null, linhasTracado = [], itemSelecionado = null, modoLinhaUnica = false, userMarker = null, watchId = null;

        function initApp() {
            carregarTracado();
            atualizarDados();
            setInterval(atualizarDados, 5000);
            
            setInterval(() => {
                if (itemSelecionado) {
                    const d = parseData(itemSelecionado.datalocal);
                    const txt = formatTicker(d);
                    
                    const sheetStatus = document.getElementById('sheet-val-status');
                    if (sheetStatus) sheetStatus.innerText = txt;

                    const popupStatus = document.getElementById('popup-status-display');
                    if (popupStatus) popupStatus.innerText = txt;
                }
            }, 1000);

            initSwipe();
        }

        async function carregarTracado() { try { const res = await fetch('json/tracado-geral.json'); if (res.ok) { const data = await res.json(); dadosTracado = data.tracados || data; } } catch (e) { console.error(e); } }

        function isHoje(data) {
            if (!data) return false;
            const hoje = new Date();
            return data.getDate() === hoje.getDate() &&
                   data.getMonth() === hoje.getMonth() &&
                   data.getFullYear() === hoje.getFullYear();
        }

        async function atualizarDados() {
            try {
                const req = await fetch(BASE_API_URL);
                const json = await req.json();
                
                // Filtro: remove veículos que não enviaram sinal hoje
                const dadosHoje = json.filter(v => isHoje(parseData(v.data_local)));

                todosDados = dadosHoje.map(v => ({ 
                    properties: { 
                        prefixo: v.prefixo, 
                        cd_linha: v.linha || "", 
                        latitude: v.latitude, 
                        longitude: v.longitude, 
                        velocidade: v.velocidade || 0, 
                        datalocal: v.data_local, 
                        sentido: v.sentido 
                    } 
                }));

                if (itemSelecionado) { 
                    const match = todosDados.find(f => String(f.properties.prefixo) === String(itemSelecionado.prefixo)); 
                    if (match) { 
                        itemSelecionado = match.properties; 
                        atualizarInterfacePainel(); 
                    } 
                }
                if (amostragemIds.size === 0) gerarAmostragemInicial();
                renderizarMapa(); 
            } catch (e) { console.error(e); }
        }

        function gerarAmostragemInicial() {
            amostragemIds.clear();
            const porEmpresa = {};
            todosDados.filter(f => f.properties.cd_linha && parseFloat(f.properties.velocidade) > 0).forEach(f => {
                const emp = getEmpresa(f.properties.prefixo);
                if (!porEmpresa[emp]) porEmpresa[emp] = [];
                porEmpresa[emp].push(f.properties.prefixo);
            });
            Object.keys(porEmpresa).forEach(emp => porEmpresa[emp].sort(() => 0.5 - Math.random()).slice(0, 20).forEach(id => amostragemIds.add(String(id))));
        }

        function formatDataHoraBadge(d) {
            if (!d) return '--:--:--, --/--/----';
            const pad = (n) => n.toString().padStart(2, '0');
            const hh = pad(d.getHours());
            const mm = pad(d.getMinutes());
            const ss = pad(d.getSeconds());
            const dia = pad(d.getDate());
            const mes = pad(d.getMonth() + 1);
            const ano = d.getFullYear();
            return `${hh}:${mm}:${ss}, ${dia}/${mes}/${ano}`;
        }

        function renderizarMapa() {
            const temBusca = termosBusca.length > 0, temSelecao = !!itemSelecionado;
            modoAmostragem = !(temBusca || temSelecao);
            const validIds = new Set();
            
            todosDados.forEach(feature => {
                const p = feature.properties;
                const id = String(p.prefixo), empresa = getEmpresa(p.prefixo), isSemLinha = !p.cd_linha || p.cd_linha.trim() === "";
                const cdLinhaAtual = String(p.cd_linha || "").trim().toLowerCase();
                const prefixoAtual = String(p.prefixo || "").trim().toLowerCase();
                
                let isAlvoEspecifico = (itemSelecionado && String(itemSelecionado.prefixo) === id);
                
                if (!isAlvoEspecifico && temBusca) {
                    isAlvoEspecifico = termosBusca.some(t => {
                        const termo = String(t).trim().toLowerCase();
                        return cdLinhaAtual === termo || prefixoAtual === termo || prefixoAtual.startsWith(termo);
                    });
                }

                let visivel = true;
                if (isAlvoEspecifico) visivel = true;
                else if (modoLinhaUnica && itemSelecionado) visivel = (String(p.cd_linha) === String(itemSelecionado.cd_linha));
                else if (temBusca) visivel = false;
                else if (modoAmostragem) visivel = amostragemIds.has(id);
                else {
                    if (isSemLinha || parseFloat(p.velocidade) === 0) visivel = false;
                }

                if (!visivel) { 
                    if (markersRegistry[id]) { 
                        busClusterGroup.removeLayer(markersRegistry[id]); 
                        delete markersRegistry[id]; 
                    } 
                    return; 
                }
                validIds.add(id);

                const linhaTxt = isSemLinha ? "S/ L" : p.cd_linha;
                const cor = CORES[empresa] || CORES['Outros'];
                const dLocal = parseData(p.datalocal);
                const dataHoraFormatted = formatDataHoraBadge(dLocal);

                const htmlIcon = `
                    <div class="bus-marker-inner">
                        <div class="bus-badge">
                            <span>${linhaTxt}</span>
                            <span>|</span>
                            <span class="bus-prefixo-highlight" style="background:${cor}">${p.prefixo}</span>
                            <span>|</span>
                            <span>${empresa}</span>
                            <span>|</span>
                            <span>${dataHoraFormatted}</span>
                        </div>
                    </div>`;

                if (markersRegistry[id]) {
                    const mk = markersRegistry[id];
                    mk.setLatLng([p.latitude, p.longitude]);
                    const el = mk.getElement();
                    if (el) el.innerHTML = htmlIcon; 
                    
                    if (mk.isPopupOpen() && isAlvoEspecifico) {
                        mk.setPopupContent(criarConteudoPopup(p, empresa));
                    }
                } else {
                    const marker = L.marker([p.latitude, p.longitude], { icon: L.divIcon({ className: 'bus-marker-container', html: htmlIcon, iconSize: [0, 0] }) });
                    
                    marker.bindPopup(criarConteudoPopup(p, empresa));

                    marker.on('mouseover', function (e) {
                        if (!itemSelecionado) {
                            this.openPopup();
                        }
                    });
                    
                    marker.on('mouseout', function (e) {
                        if (!itemSelecionado || String(itemSelecionado.prefixo) !== String(p.prefixo)) {
                            this.closePopup();
                        }
                    });

                    marker.on('click', (e) => { 
                        L.DomEvent.stopPropagation(e); 
                        handleBusClick(p, empresa, marker); 
                        if (window.innerWidth >= 768) {
                            marker.openPopup();
                        }
                    });
                    
                    busClusterGroup.addLayer(marker);
                    markersRegistry[id] = marker;
                }
            });
            for (let id in markersRegistry) {
                if (!validIds.has(id)) { 
                    busClusterGroup.removeLayer(markersRegistry[id]); 
                    delete markersRegistry[id]; 
                }
            }
        }

        function criarConteudoPopup(p, empresa) {
            const d = parseData(p.datalocal);
            const timeStr = d ? d.toTimeString().split(' ')[0] : '--:--';
            const cor = CORES[empresa] || '#888';
            const sentidoTexto = p.sentido == '1' ? 'Volta' : 'Ida';

            return `
            <div class="popup-header" style="border-top: 5px solid ${cor};">
                ${p.cd_linha ? 'Linha ' + p.cd_linha : 'Sem Linha'}
            </div>
            <div class="popup-body">
                <div class="popup-row"><span class="popup-label">Prefixo</span><span class="popup-val">${p.prefixo}</span></div>
                <div class="popup-row"><span class="popup-label">Empresa</span><span class="popup-val" style="color:${cor}">${empresa}</span></div>
                <div class="popup-row"><span class="popup-label">Sentido</span><span class="popup-val">${sentidoTexto}</span></div>
                <div class="popup-row"><span class="popup-label">Velocidade</span><span class="popup-val">${parseInt(p.velocidade)} km/h</span></div>
                <div class="popup-row"><span class="popup-label">Atualizado</span><span class="popup-val">${timeStr}</span></div>
                <hr style="margin:5px 0; border: 0; border-top: 1px solid rgba(0,0,0,0.1);">
                <div class="popup-row"><span class="popup-label">Status</span><span class="popup-val" id="popup-status-display">${formatTicker(d)}</span></div>
            </div>`;
        }

        function handleBusClick(p, empresa, marker) { 
            const linhaAnterior = itemSelecionado ? itemSelecionado.cd_linha : null;
            const novaLinha = p.cd_linha;

            itemSelecionado = p; 
            
            if (p.cd_linha) desenharTracado(p.cd_linha, empresa, p.sentido); 
            else limparTracado(); 
            
            if (termosBusca.length === 0) modoLinhaUnica = true; 
            
            renderizarMapa(); 
            openBottomSheet(p, empresa); 
            
            document.getElementById('btn-recenter').classList.add('show'); 
            
            if (linhaAnterior !== novaLinha) {
                fitBusRoute(); 
            }
        }

        function openBottomSheet(p, empresa) { 
            if (window.innerWidth >= 768) return; 

            const sheet = document.getElementById('bottom-sheet'); 
            sheet.style.transform = ''; 
            sheet.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)'; 
            atualizarInterfacePainel(); 
            sheet.classList.add('active'); 
            document.body.classList.add('sheet-open'); 
        }

        function atualizarInterfacePainel() {
            if (!itemSelecionado) return;
            const p = itemSelecionado, empresa = getEmpresa(p.prefixo), d = parseData(p.datalocal), cor = CORES[empresa] || '#888';
            document.getElementById('sheet-data').innerHTML = `
                <div class="sheet-header-row">
                    <div class="sheet-title">
                        <div class="status-dot" style="background:${cor}"></div>
                        <span>${p.cd_linha ? 'Linha ' + p.cd_linha : 'Sem Linha'}</span>
                        <svg class="wifi-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <circle class="wifi-layer layer-1-dot" cx="12" cy="21" r="2" fill="currentColor"/>
                            <path class="wifi-layer layer-2-arc" d="M7.76 16.24C8.88 15.12 10.39 14.5 12 14.5C13.61 14.5 15.12 15.12 16.24 16.24" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                            <path class="wifi-layer layer-3-arc" d="M4.93 13.41C6.8 11.54 9.32 10.5 12 10.5C14.68 10.5 17.2 11.54 19.07 13.41" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                            <path class="wifi-layer layer-4-arc" d="M2.1 10.59C4.73 7.95 8.27 6.5 12 6.5C15.73 6.5 19.27 7.95 21.9 10.59" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                        </svg>
                    </div>
                    <div class="sheet-close" onclick="closeBottomSheet()">✕</div>
                </div>
                <div class="info-grid">
                    <div class="info-card"><div class="info-label">PREFIXO</div><div class="info-value">${p.prefixo}</div></div>
                    <div class="info-card"><div class="info-label">EMPRESA</div><div class="info-value" style="color:${cor}">${empresa}</div></div>
                    <div class="info-card"><div class="info-label">SENTIDO</div><div class="info-value">${p.sentido == '1' ? 'Volta' : 'Ida'}</div></div>
                    <div class="info-card"><div class="info-label">VELOCIDADE</div><div class="info-value">${parseInt(p.velocidade)} km/h</div></div>
                    <div class="info-card"><div class="info-label">ATUALIZADO</div><div class="info-value">${d ? d.toTimeString().split(' ')[0] : '--'}</div></div>
                    <div class="info-card"><div class="info-label">STATUS</div><div class="info-value" id="sheet-val-status">${formatTicker(d)}</div></div>
                </div>`;
        }

        function initSwipe() { const sheet = document.getElementById('bottom-sheet'); let startY = 0, currentY = 0, startTime = 0; sheet.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; startTime = Date.now(); sheet.style.transition = 'none'; }, {passive: true}); sheet.addEventListener('touchmove', (e) => { currentY = e.touches[0].clientY; const diff = currentY - startY; if (diff > 0) sheet.style.transform = `translateY(${diff}px)`; }, {passive: true}); sheet.addEventListener('touchend', (e) => { const diff = currentY - startY; const duration = Date.now() - startTime; const velocity = diff / duration; sheet.style.transition = 'transform 0.3s cubic-bezier(0.1, 0.5, 0.1, 1)'; if (diff > 120 || velocity > 0.5) closeBottomSheet(); else sheet.style.transform = 'translateY(0)'; startY = 0; currentY = 0; }); }
        function closeBottomSheet() { const sheet = document.getElementById('bottom-sheet'); sheet.style.transform = 'translateY(110%)'; sheet.classList.remove('active'); document.body.classList.remove('sheet-open'); }
        
        function getEmpresa(p) { 
            const s = String(p || '').trim();
            if (!/^\d{6}$/.test(s)) return 'Outros';

            if (s.startsWith('11') || s.startsWith('12')) return 'Piracicabana';
            if (s.startsWith('22') || s.startsWith('23')) return 'Pioneira';
            if (s.startsWith('33') || s.startsWith('34')) return 'Urbi';
            if (s.startsWith('44')) return 'Marechal';
            if (s.startsWith('50') || s.startsWith('71')) return 'BsBus';
            
            return 'Outros'; 
        }

        function parseData(s) { if(!s) return null; return s.includes('-') ? new Date(s.replace(/-/g, '/')) : new Date(s); }
        
        function formatTicker(d) {
            if (!d) return "Desconhecido";
            const diff = Math.floor((new Date() - d) / 1000);
            
            if (diff < 60) return `${diff < 0 ? 0 : diff}s atrás`;
            
            const min = Math.floor(diff / 60);
            const sec = diff % 60;
            if (diff < 3600) return `${min}m ${sec < 10 ? '0'+sec : sec}s atrás`;
            
            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);
            if (diff < 86400) return `${h}h ${m < 10 ? '0'+m : m}m atrás`;
            
            const dias = Math.floor(diff / 86400);
            return `${dias} ${dias === 1 ? 'dia' : 'dias'} atrás`;
        }

        function desenharTracado(cd, emp, sApi) { limparTracado(); if (!dadosTracado) return; const cands = dadosTracado.filter(x => String(x.linha) === String(cd)); if (!cands.length) return; let rota = cands.find(c => c.sentido === "CIRCULAR") || cands.find(c => c.sentido === (sApi === '0' ? 'I' : 'V')) || cands[0]; const coords = rota.coordenadas; const cor = CORES[emp] || '#000'; linhasTracado.push(L.polyline(coords, { color: '#ffffff', weight: 6, opacity: 0.8 }).addTo(map)); linhasTracado.push(L.polyline(coords, { color: cor, weight: 3, opacity: 1 }).addTo(map)); }
        function limparTracado() { linhasTracado.forEach(l => map.removeLayer(l)); linhasTracado = []; }

        const searchInput = document.getElementById('search');
        let highlightedIndex = -1;
        searchInput.addEventListener('input', (e) => { 
            const val = e.target.value.toLowerCase().trim(); 
            highlightedIndex = -1; 
            document.getElementById('btn-search-clear').classList.toggle('visible', val.length > 0); 
            if (!val) { 
                document.getElementById('suggestions').style.display = 'none'; 
                return; 
            } 
            
            const matches = Array.from(new Set(todosDados.flatMap(f => [f.properties.cd_linha, f.properties.prefixo])))
                .filter(x => {
                    if (!x) return false;
                    const str = String(x).toLowerCase().trim();
                    return str === val || str.startsWith(val) || str.includes(val);
                })
                .sort((a,b) => String(a).localeCompare(String(b), undefined, {numeric: true}))
                .slice(0, 50); 
            
            document.getElementById('suggestions').innerHTML = matches.map((m, i) => `<div class="suggestion-item" data-index="${i}" onclick="selectSuggestion('${m}')">${m}</div>`).join(''); 
            document.getElementById('suggestions').style.display = matches.length ? 'block' : 'none'; 
        });

        searchInput.addEventListener('keydown', (e) => { 
            const sugBox = document.getElementById('suggestions'); 
            const items = sugBox.getElementsByClassName('suggestion-item'); 
            if (e.key === 'ArrowDown') { 
                e.preventDefault(); 
                highlightedIndex = (highlightedIndex + 1) % items.length; 
                updateHighlight(items); 
            } else if (e.key === 'ArrowUp') { 
                e.preventDefault(); 
                highlightedIndex = (highlightedIndex - 1 + items.length) % items.length; 
                updateHighlight(items); 
            } else if (e.key === 'Enter') { 
                e.preventDefault(); 
                if (highlightedIndex > -1 && items[highlightedIndex]) items[highlightedIndex].click(); 
                else if (items.length > 0) items[0].click(); 
                setTimeout(() => searchInput.focus(), 10); 
            } else if (e.key === 'Escape') { 
                limparBuscaInput(); 
            } 
        });

        function updateHighlight(items) { Array.from(items).forEach((el, i) => { el.classList.toggle('highlighted', i === highlightedIndex); if (i === highlightedIndex) el.scrollIntoView({ block: 'nearest' }); }); }
        
        function selectSuggestion(val) { 
            if (!termosBusca.includes(val)) { 
                termosBusca.push(val); 
                const tag = document.createElement('div'); 
                tag.className = 'tag'; 
                tag.innerHTML = `${val} <span onclick="removerTag(event, '${val}')">✕</span>`; 
                document.getElementById('search-tags').appendChild(tag); 
            } 
            limparBuscaInput(); 
            renderizarMapa(); 
        }

        function removerTag(e, val) { 
            e.stopPropagation(); 
            termosBusca = termosBusca.filter(t => t !== val); 
            renderizarMapa(); 
            const tags = document.getElementById('search-tags'); 
            Array.from(tags.children).forEach(tag => { if (tag.textContent.includes(val)) tag.remove(); }); 
        }

        function limparBuscaInput() { 
            searchInput.value = ''; 
            document.getElementById('suggestions').style.display = 'none'; 
            highlightedIndex = -1; 
            document.getElementById('btn-search-clear').classList.remove('visible'); 
        }

        map.on('click', () => { 
            if (itemSelecionado) { 
                itemSelecionado = null; 
                modoLinhaUnica = false; 
                limparTracado(); 
                renderizarMapa(); 
                closeBottomSheet(); 
                document.getElementById('btn-recenter').classList.remove('show'); 
            } 
        });

        function fitBusRoute() { if (!itemSelecionado) return; const mk = markersRegistry[String(itemSelecionado.prefixo)], group = new L.FeatureGroup(); if (mk) group.addLayer(mk); linhasTracado.forEach(l => group.addLayer(l)); map.fitBounds(group.getBounds(), { padding: [50, 50], maxZoom: 15 }); }
        
        function toggleLocation() { 
            if (watchId) { 
                navigator.geolocation.clearWatch(watchId); 
                watchId = null; 
                if (userMarker) map.removeLayer(userMarker); 
            } else { 
                watchId = navigator.geolocation.watchPosition(pos => { 
                    const { latitude, longitude } = pos.coords; 
                    if (!userMarker) userMarker = L.marker([latitude, longitude], { icon: L.divIcon({ className: 'user-location-marker', iconSize: [16, 16] }) }).addTo(map); 
                    else userMarker.setLatLng([latitude, longitude]); 
                    map.setView([latitude, longitude], 15); 
                }, null, { enableHighAccuracy: true }); 
            } 
        }

        initApp();
    </script>
</body>
</html>
